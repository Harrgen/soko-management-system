version: "3.9"

services:
  db:
    image: postgres:13
    container_name: soko-management-system-db
    environment:
      POSTGRES_USER: soko_user
      POSTGRES_PASSWORD: soko_pass
      POSTGRES_DB: soko_db
    ports:
      - "5432:5432"
    volumes:
      - soko_db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: soko-management-system-web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://soko_user:soko_pass@db:5432/soko_db
      DEBUG: "True"

volumes:
  soko_db_data:
